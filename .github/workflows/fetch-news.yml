name: Fetch News

on:
  # Scheduling now happens via an external cron (cron-job.org) calling this
  # workflow_dispatch endpoint on a reliable ~20-minute cadence — GitHub's
  # own `schedule:` trigger is documented as best-effort and can fire at
  # unpredictable times. Running BOTH at once meant they could occasionally
  # land close together and both try to push to `main` at the same moment,
  # which is the most likely cause of the "fatal error in commit_refs" /
  # "[remote rejected] main -> main" push failure — GitHub's own ref-locking
  # rejecting a genuinely concurrent push, not a real problem with the data.
  workflow_dispatch: {}

concurrency:
  group: fetch-news
  cancel-in-progress: true

permissions:
  contents: write   # needed to commit the updated data/news.json back

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run collector
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/fetch-news.mjs

      - name: Commit updated data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json data/seen.json
          git diff --staged --quiet && exit 0
          git commit -m "Update news data [skip ci]"
          # A push can still be transiently rejected (GitHub-side hiccup, or
          # a run that started just before this one hadn't finished pushing
          # yet) even with a single trigger source. Pull-rebase-retry once
          # before giving up, instead of failing the whole run over it.
          for attempt in 1 2 3; do
            if git push; then break; fi
            echo "Push failed (attempt $attempt) — pulling latest and retrying..."
            git pull --rebase origin main
            sleep 3
          done
