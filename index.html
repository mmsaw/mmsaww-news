async function loadBTC() {
  try {
    const res = await Promise.race([
      fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true"),
      new Promise((_,r) => setTimeout(() => r("to"), 7000))
    ]);
    if (!res.ok) return;
    const d = (await res.json()).bitcoin;
    document.getElementById("btc-val").textContent = "$" + d.usd.toLocaleString("en-US", {maximumFractionDigits:0});
    const chg = d.usd_24h_change;
    const el = document.getElementById("btc-chg");
    el.textContent = (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
    el.className = "rate-chg " + (chg > 0.3 ? "up" : chg < -0.3 ? "dn" : "flat");
  } catch {}
}

async function loadCBR() {
  const CBR = "https://www.cbr-xml-daily.ru/daily_json.js";
  const proxies = [
    `https://api.allorigins.win/get?url=${encodeURIComponent(CBR)}`,
    `https://corsproxy.io/?${encodeURIComponent(CBR)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(CBR)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(CBR)}`,
  ];
  let cbr = null;
  for (const p of proxies) {
    try {
      const res = await Promise.race([fetch(p), new Promise((_,r) => setTimeout(()=>r("to"),5000))]);
      if (!res.ok) continue;
      const ct = res.headers.get("content-type")||"";
      const text = ct.includes("json") ? (await res.json()).contents||"" : await res.text();
      if (text && text.includes("USD")) { cbr = JSON.parse(text); break; }
    } catch { continue; }
  }
  if (!cbr) { document.getElementById("rates-ts").textContent = "ЦБ: нет данных"; return; }

  const usd = cbr.Valute.USD, eur = cbr.Valute.EUR;
  const fmt = r => r.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});
  const chg = (cur,prev) => {
    const d = cur-prev;
    return { text:(d>0?"+":"")+d.toFixed(2)+" ₽", cls: d>0.01?"up":d<-0.01?"dn":"flat" };
  };

  document.getElementById("usd-val").textContent = fmt(usd.Value)+" ₽";
  const uc = chg(usd.Value,usd.Previous);
  document.getElementById("usd-chg").textContent = uc.text;
  document.getElementById("usd-chg").className   = "rate-chg "+uc.cls;

  document.getElementById("eur-val").textContent = fmt(eur.Value)+" ₽";
  const ec = chg(eur.Value,eur.Previous);
  document.getElementById("eur-chg").textContent = ec.text;
  document.getElementById("eur-chg").className   = "rate-chg "+ec.cls;

  // Label with weekend notice
  const now = new Date();
  const dow = now.getDay();
  const isWeekend = dow === 0 || dow === 6;
  const dateStr = new Date(cbr.Date).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  document.getElementById("rates-ts").textContent =
    "ЦБ РФ · " + dateStr + (isWeekend ? " · пятничный курс" : "");

  // Weekday auto-refresh at 11:30 MSK
  if (!isWeekend) {
    const msk = new Date(now.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));
    const mskMin = msk.getHours()*60+msk.getMinutes();
    const ms = mskMin < 11*60+30
      ? (11*60+30-mskMin)*60000
      : 30*60000;
    setTimeout(loadCBR, ms);
  }
}

  80:"🌦",81:"🌧",82:"⛈",85:"🌨",86:"❄️",

const WMO_LABELS = {
  0:"Ясно",1:"Почти ясно",2:"Переменная",3:"Пасмурно",
  45:"Туман",48:"Туман",51:"Изморось",53:"Изморось",55:"Изморось",

  95:"Гроза",96:"Гроза",99:"Гроза"
};

function loadWeather() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const {latitude:lat, longitude:lon} = pos.coords;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m&wind_speed_unit=ms&timezone=auto`;
      const res = await Promise.race([fetch(url), new Promise((_,r)=>setTimeout(()=>r("to"),7000))]);
      if (!res.ok) return;
      const d = (await res.json()).current;
      const temp   = Math.round(d.temperature_2m);
      const feels  = Math.round(d.apparent_temperature);
      const code   = d.weathercode;
      const wind   = Math.round(d.windspeed_10m);
      const icon   = WMO_ICONS[code] || "🌡";
      const label  = WMO_LABELS[code] || "";

      document.getElementById("weather-val").textContent = `${icon} ${temp}°C (ощущается ${feels}°C)`;
      document.getElementById("weather-desc").textContent = `${label} · 💨 ${wind} м/с`;
      document.getElementById("weather-desc").className = "rate-chg flat";
      document.getElementById("weather-item").style.display = "";
      document.getElementById("weather-dot").style.display  = "";
      setTimeout(loadWeather, 30*60*1000);
    } catch {}
  }, ()=>{}, {timeout:9000, maximumAge:300000});
}

let siriBodyOpen = false;

function toggleSiriBody() {
  siriBodyOpen = !siriBodyOpen;
  document.getElementById("siri-body").classList.toggle("open", siriBodyOpen);
  const ch = document.getElementById("siri-chevron");

function triggerSentiment() {
  if (state.sentimentDone) return;
  if (state.sentimentModel === "off") return;
  if (state.cards.length < 3) return;
  generateSentiment(state.cards, state.filter);
}

function regenSentiment() {
  try {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const cat = state.filter === "all" ? "all" : state.filter;
    localStorage.removeItem("siri_" + y.toISOString().slice(0, 10) + "_" + cat);
  } catch(e) {}
  state.sentimentDone = false;
  generateSentiment(state.cards, state.filter);
}

async function generateSentiment(cards, filterCat) {
  const m   = state.sentimentModel;
  const key = state.groqKey;
  const cat = filterCat || "all";

  const wrap  = document.getElementById("siri-wrap");
  const body  = document.getElementById("siri-body");
  const badge = document.getElementById("siri-badge");
  const regen = document.getElementById("siri-regen");
  const titleEl = document.querySelector(".siri-title");
  if (!wrap || !body) return;

  wrap.style.display = "";
  wrap.classList.remove("idle");

  // Update widget title to reflect current category
  const catNames = { all:"Резюме за вчера", geopolitics:"Геополитика · вчера",
    finance:"Финансы · вчера", tech:"Технологии · вчера",
    lifestyle:"Лайфстайл · вчера", local:"Локальное · вчера" };
  if (titleEl) titleEl.textContent = catNames[cat] || "Резюме за вчера";

  if (m === "off" || !key) {
    wrap.classList.add("idle");
    body.innerHTML = `<div class="siri-no-key">
      Для резюме добавьте ключ Groq
      <button class="siri-setup-btn" onclick="document.getElementById('api-panel').classList.add('open')">⚙ Настройки</button>
    </div>`;
    body.classList.add("open");
    siriBodyOpen = true;
    return;
  }

  // Daily cache key includes category
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yKey = "siri_" + yesterday.toISOString().slice(0, 10) + "_" + cat;
  const cached = (() => {
    try { return JSON.parse(localStorage.getItem(yKey) || "null"); } catch(e) { return null; }
  })();
  if (cached && cached.html) {
    body.innerHTML = cached.html;
    badge.textContent = cached.badge || "";
    badge.className   = "siri-badge " + (cached.bc || "neutral");
    body.classList.add("open");
    siriBodyOpen = true;
    if (regen) regen.style.display = "";
    wrap.classList.add("idle");
    state.sentimentDone = true;
    return;
  }

  body.innerHTML = `<div class="siri-loading"><div class="siri-dots"><span></span><span></span><span></span><span></span><span></span></div> составляю резюме…</div>`;
  body.classList.add("open");
  siriBodyOpen = true;
  if (regen) regen.style.display = "none";

  // Build card pool: yesterday's cards, filtered by category if not "all"
  const yStart = new Date(yesterday); yStart.setHours(0,0,0,0);
  const yEnd   = new Date(yesterday); yEnd.setHours(23,59,59,999);
  let yCards = cards.filter(c => c.date >= yStart && c.date <= yEnd);
  if (cat !== "all") yCards = yCards.filter(c => c.cat === cat);
  const pool = yCards.length >= 3 ? yCards : (
    cat !== "all" ? cards.filter(c => c.cat === cat).slice(0, 30) : cards.slice(0, 40)
  );

  const dateStr = yesterday.toLocaleDateString("ru-RU", { day:"numeric", month:"long" });

  let prompt;
  if (cat === "all") {
    // Cross-category overview: group by category, pick top news per section
    const catLabels = { geopolitics:"Геополитика", finance:"Финансы",
      tech:"Технологии", lifestyle:"Лайфстайл" };
    const byCat = {};
    pool.forEach(c => { if (catLabels[c.cat]) (byCat[c.cat] = byCat[c.cat] || []).push(c); });
    const sections = Object.entries(catLabels)
      .filter(([id]) => (byCat[id]||[]).length > 0)
      .map(([id, label]) =>
        `### ${label}\n` + (byCat[id]||[]).slice(0,6).map(c => `- ${c.title_ru||c.title}`).join("\n")
      ).join("\n\n");

    prompt = `Ты редактор новостного агрегатора. Напиши общее резюме за ${dateStr} по разделам.\n\nДля каждого раздела — 1-2 предложения с ключевыми событиями. Конкретные факты, имена, цифры.\nВ конце — одно предложение с тональностью дня.\n\nОтветь ТОЛЬКО HTML:\n<p><b>🌍 Геополитика:</b> ...</p>\n<p><b>💰 Финансы:</b> ...</p>\n<p><b>💻 Технологии:</b> ...</p>\n<p><b>🎭 Лайфстайл:</b> ...</p>\n<p><b>📊 Тональность дня:</b> Слово — почему</p>\n\nПропускай разделы без новостей. Максимум 180 слов. Только HTML.\n\nНовости:\n${sections}`;
  } else {
    // Single-category deep-dive
    const catLabel = { geopolitics:"Геополитика", finance:"Финансы",
      tech:"Технологии", lifestyle:"Лайфстайл", local:"Локальные новости" }[cat] || cat;
    const items = pool.slice(0, 12).map(c => `- ${c.title_ru||c.title}`).join("\n");

    prompt = `Ты редактор новостного агрегатора. Напиши резюме раздела «${catLabel}» за ${dateStr}.\n\nВыдели 2-3 самых важных события, 2-3 предложения на каждое. Конкретные факты, имена, цифры. В конце — одно предложение с общим итогом раздела.\n\nОтветь ТОЛЬКО HTML-параграфами:\n<p><b>Событие 1:</b> ...</p>\n<p><b>Событие 2:</b> ...</p>\n<p><b>Итог:</b> ...</p>\n\nМаксимум 160 слов. Только HTML.\n\nНовости раздела:\n${items}`;
  }

  try {
    let text = null;
    if (m === "groq") {
      const d = await groqFetch({
        model: "openai/gpt-oss-120b",
        max_tokens: 900,
        reasoning_effort: "low",
        messages: [{ role: "user", content: prompt }]
      }, key, 25000);
      text = d?.choices?.[0]?.message?.content?.trim() || null;
    }

    if (!text) throw new Error("empty response");

    const tl = text.toLowerCase();
    let bc = "neutral", bt = "—";
    if (/напряжённ|напряженн/.test(tl))  { bc = "tense";   bt = "Напряжённая"; }
    else if (/тревожн/.test(tl))          { bc = "alarm";   bt = "Тревожная"; }
    else if (/позитивн/.test(tl))         { bc = "calm";    bt = "Позитивная"; }
    else if (/смешанн/.test(tl))          { bc = "mixed";   bt = "Смешанная"; }
    else if (/нейтральн/.test(tl))        { bc = "neutral"; bt = "Нейтральная"; }

    badge.textContent = bt;
    badge.className   = "siri-badge " + bc;
    body.innerHTML    = text;
    if (regen) regen.style.display = "";
    wrap.classList.add("idle");
    state.sentimentDone = true;

    try { localStorage.setItem(yKey, JSON.stringify({ html: text, badge: bt, bc, ts: Date.now() })); } catch(e) {}
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.startsWith("siri_") && k !== yKey) localStorage.removeItem(k);
      }
    } catch(e) {}

  } catch(e) {
    wrap.classList.add("idle");
    body.innerHTML = `<div class="siri-no-key" style="color:var(--text3)">
      Ошибка (${(e?.message || "").slice(0, 60)})
      <button class="siri-setup-btn" onclick="regenSentiment()">Повторить</button>
    </div>`;
    if (regen) regen.style.display = "";
  }
}

// Get all RSS text from raw sources, deduplicated and joined
function getRSSText(card) {
  const parts = (card.raw || [])
    .map(r => {
      const desc = decodeEntities(r.description || "");
      const title = r.title || "";
      if (desc && desc.trim() !== title.trim() && desc.length > 20) return desc;
      return title;
    })
    .filter((t, i, a) => t.length > 20 && a.indexOf(t) === i);
  return parts.join("\n\n") || decodeEntities(card.summary || "") || card.title || "";
}



function renderTextHTML(text, isAI, loadingAI, powered) {

    ? `<span class="expand-powered" style="color:var(--accent2)">&#x1F9E0; Генерирую резюме…</span>`
    : isAI
      ? `<span class="expand-powered">${powered||"Powered by Groq GPT-OSS"}</span>`
      : ``;
  return `<p class="expand-summary">${escHtml(text)}</p>${hint}`;
}

function renderSummary(bodyEl, cardId) {

  if (!c) return;

// Score a text paragraph: higher = more prose-like, lower = nav/ad junk
function scoreParagraph(p) {
  const t = p.trim();
  if (t.length < 60) return 0;
  const words = t.split(/\s+/);
  if (words.length < 10) return 0;
  // MUST have sentence-ending punctuation — nav menus never do
  const sentences = (t.match(/[.!?…]+/g)||[]).length;
  if (sentences === 0) return 0;
  // Penalize bullet-heavy content
  const bulletRatio = (t.match(/^[*\-]/gm)||[]).length / words.length;
  if (bulletRatio > 0.3) return 0;
  // Penalize lines with multiple URLs
  if ((t.match(/https?:\/\//g)||[]).length > 1) return 0;
  // Penalize all-caps word ratio > 30% (nav menus in Russian/English)
  const capsWords = words.filter(w => w.length > 3 && w === w.toUpperCase() && /[A-ZА-Я]/.test(w)).length;
  if (capsWords / words.length > 0.3) return 0;
  // Penalize sentence-per-word ratio too low (list of topics glued together)
  if (sentences / words.length < 0.04) return 0;
  // Kill subscription/tag lines: "Подписывайтесь на темы: [x] Иран [x] США..."
  if ((t.match(/\[x\]/g)||[]).length >= 2) return 0;
  if (/Подписывайтесь|Subscribe to|Follow us|Sign up/i.test(t) && t.length < 200) return 0;
  return sentences * 15 + words.length;
}

// Extract best prose paragraphs from Jina markdown
function extractProseFromJina(raw) {
  // Step 1: strip metadata header (everything up to first blank line after headers)
  let t = raw.replace(/^(Title|URL Source|URL|Published Time|Published Date|Markdown Content|Author):[^\n]*\n/gm, "");

  // Step 2: strip images and convert links to text
  t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, "");
  t = t.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");

  // Step 3: strip markdown formatting
  t = t.replace(/^#{1,6}\s+/gm, "");
  t = t.replace(/^[=\-]{3,}\s*$/gm, "");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "$1").replace(/\*([^*\n]+)\*/g, "$1");
  t = t.replace(/^>\s*/gm, "");
  t = t.replace(/^\s*[*\-]\s+/gm, ""); // strip list markers but keep text

  // Step 4: decode entities
  t = decodeEntities(t);

  // Step 5: split into paragraphs and score each
  const paragraphs = t.split(/\n{2,}/);
  const scored = paragraphs
    .map(p => ({ text: p.trim(), score: scoreParagraph(p) }))
    .filter(p => p.score > 0)
    .sort((a, b) => b.score - a.score);

  if (scored.length === 0) return null;

  // Take top paragraphs up to ~3000 chars, preserving order from original
  const topTexts = new Set(scored.slice(0, 15).map(p => p.text)); // more paragraphs for rich articles
  const ordered = paragraphs
    .map(p => p.trim())
    .filter(p => topTexts.has(p))
    .join("\n\n");

  return ordered.length > 150 ? ordered : null;
}

async function fetchArticleText(url) {
  if (!url) return null;

  try {
    // Jina Reader with X-Target-Selector to get only article body
    // For known sites, restrict to article content area
    const jinaHeaders = { "X-Timeout": "10" };
    if (url.includes("kommersant.ru")) {
      jinaHeaders["X-Target-Selector"] = ".article_text_wrapper, .article__text, [itemprop=articleBody]";
      jinaHeaders["X-Remove-Selector"] = ".article_sidebar, .aside, .related, footer, nav, .tags, .subscribe";
    } else if (url.includes("forbes.ru")) {
      jinaHeaders["X-Target-Selector"] = ".article__body, .article-body, [class*=article__content], .content__text";
      jinaHeaders["X-Remove-Selector"] = ".tags, .related, .aside, footer, nav, .subscribe, .social";
    } else if (url.includes("banki.ru")) {
      jinaHeaders["X-Target-Selector"] = ".article__text, .news-text, [class*=article-body], .text-content";
      jinaHeaders["X-Remove-Selector"] = ".aside, .related, footer, nav, .tags";
    } else if (url.includes("reuters.com")) {
      jinaHeaders["X-Target-Selector"] = "[class*=article-body], [class*=ArticleBody], .StandardArticleBody_body";
    } else if (url.includes("bbc.")) {
      jinaHeaders["X-Target-Selector"] = "[class*=article], article";
    } else if (url.includes("aljazeera.com")) {
      jinaHeaders["X-Target-Selector"] = ".wysiwyg, .article-p-wrapper, [class*=ArticleBody]";
    } else if (url.includes("mosday.ru")) {
      jinaHeaders["X-Target-Selector"] = ".news-text, .article-text, article";
    }
    const res = await fetch("https://r.jina.ai/" + url, {
      headers: jinaHeaders,
      signal: AbortSignal.timeout(12000),
    });
    if (res.ok) {
      const raw = await res.text();
      const prose = extractProseFromJina(raw);
      if (prose && prose.length > 200) return prose.slice(0, 5000);
    }
  } catch {}

  // Fallback: allorigins — only <article> or <main>
  try {
    const res = await fetch(
      "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
      { signal: AbortSignal.timeout(7000) }
    );
    if (!res.ok) return null;
    const raw = await res.text();
    const m = raw.match(/<article[^>]*>([\s\S]{400,}?)<\/article>/i)
           || raw.match(/<main[^>]*>([\s\S]{400,}?)<\/main>/i);
    if (!m) return null;
    const clean = decodeEntities(m[1]
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/<style[\s\S]*?<\/style>/gi, "")
      .replace(/<[^>]+>/g, " ")
      .replace(/ {3,}/g, " ").trim());
    const words = clean.split(/\s+/).filter(w => w.length > 2);
    if (words.length < 80) return null;
    return words.slice(0, 500).join(" ");
  } catch {}
  return null;
}

async function enrichNoKey(card, bodyEl, cardId) {
  const links = [...new Set((card.raw||[]).map(r=>r.link).filter(Boolean))];
  let text = null;
  let fromJina = false;

  // Try Jina for each source link
  for (const link of links.slice(0, 2)) {
    const fetched = await fetchArticleText(link);
    if (fetched && fetched.length > 150) { text = fetched; fromJina = true; break; }
  }

  // Jina failed (paywall/block) — fall back to RSS descriptions
  if (!text) {
    // For RSS fallback, collect raw descriptions (may be English for western sources)
    const rssRaw = (card.raw||[])
      .map(r => (r.description || r.title || "").trim())
      .filter((t,i,a) => t.length > 20 && a.indexOf(t) === i)
      .join(" ");
    text = rssRaw || getRSSText(card);
  }

  if (!text || text.length < 20) return;

  // Detect English by checking raw text chars (not translated title)
  function isTextEnglish(t) {
    const sample = t.slice(0, 400).replace(/[^a-zA-Zа-яА-Я]/g, "");
    const lat = (sample.match(/[a-zA-Z]/g)||[]).length;
    const cyr = (sample.match(/[а-яА-Я]/g)||[]).length;
    return lat > cyr; // any majority of latin = English
  }

  // Always translate western sources OR English text
  const westernSources = ["BBC","Al Jazeera","Guardian","Politico"];
  const isWestern = (card.sources||[]).some(s => westernSources.some(w => s.includes(w)));
  if (state.lang === "ru" && (isWestern || isTextEnglish(text))) {
    // For longer Jina text — translate first 2000 chars in chunks of 500
    if (fromJina && text.length > 600) {
      const chunks = [];
      for (let i = 0; i < Math.min(text.length, 4000); i += 500) {
        chunks.push(text.slice(i, i + 500));
      }
      const translated = await Promise.all(chunks.map(c => gtranslate(c, "ru")));
      const joined = translated.filter(Boolean).join(" ");
      if (joined.length > 100) text = joined;
    } else {
      const translated = await gtranslate(text.slice(0, 1000), "ru");
      if (translated && translated.length > 50) text = translated;
    }
  }

  const display = cutAtSentence(text, 600);
  const bodyNow = document.getElementById("expand-body-" + cardId);
  if (bodyNow) {
    const badge = (isWestern || (text && isTextEnglish(text)))
      ? `<div style="font-size:11px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:6px">
           <span style="font-size:13px">🌐</span> Переведено с английского · 
           <a href="${(card.raw||[{link:card.link}])[0].link}" target="_blank" 
              style="color:var(--accent2);text-decoration:none" 
              onclick="event.stopPropagation()">оригинал</a>
         </div>`
      : "";
    bodyNow.innerHTML = badge + renderTextHTML(display, false, false);
  }
}

// Cut text at a sentence boundary within maxChars — never mid-sentence
function cutAtSentence(text, maxChars) {
  if (!text) return "";
  if (text.length <= maxChars) return text;
  // Find last sentence end (. ! ?) before maxChars
  const chunk = text.slice(0, maxChars);
  const lastEnd = Math.max(
    chunk.lastIndexOf(". "), chunk.lastIndexOf("! "),
    chunk.lastIndexOf("? "), chunk.lastIndexOf(".\n"),
    chunk.lastIndexOf("\u2026")
  );
  if (lastEnd > maxChars * 0.5) {
    return chunk.slice(0, lastEnd + 1).trim();
  }
  // Fallback: cut at last space
  const lastSpace = chunk.lastIndexOf(" ");
  return chunk.slice(0, lastSpace > 0 ? lastSpace : maxChars).trim() + "…";
}

async function generateAISummary(card, bodyEl, cardId) {
  const links = [...new Set((card.raw||[]).map(r=>r.link).filter(Boolean))];

  // Speed: skip Jina if RSS already rich, else try only 1 link (not 3)
  const _rssRaw = (card.raw||[]).map(r=>decodeEntities(r.description||"")).join(" ").replace(/<[^>]+>/g,"");
  let fetched_single = null;
  if (_rssRaw.length < 300 && links.length) fetched_single = await fetchArticleText(links[0]);

  // Fake the allSettled shape so rest of code works unchanged
  const fetched = links.slice(0,3).map((_, i) => i===0 && fetched_single
    ? {status:"fulfilled", value: fetched_single}
    : {status:"rejected"});

  const articleParts = [];
  links.slice(0, 3).forEach((link, i) => {
    const r = fetched[i];
    if (r.status === "fulfilled" && r.value && r.value.length > 150) {
      const src = (card.raw||[]).find(x => x.link === link)?.sourceName || "";
      articleParts.push((src ? "[" + src + "]\n" : "") + r.value);
    }
  });

  let articleContent = articleParts.join("\n\n---\n\n");

  // Validate: check if content has real sentences (not nav junk)
  const sentenceCount = (articleContent.match(/[.!?…]+/g)||[]).length;
  const wordCount2 = articleContent.split(/\s+/).length;
  const fromFull = articleContent.length > 300 && sentenceCount > 3 && sentenceCount/wordCount2 > 0.03;

  if (!fromFull) {
    // Fall back to RSS — at least it's clean
    articleContent = (card.raw||[])
      .map(r => "[" + (r.sourceName||"") + "] " + r.title + "\n" + decodeEntities(r.description||""))
      .join("\n\n");
  }

  const lang = state.lang === "ru" ? "на русском языке" : "in English";
  // Force Russian output even if source text is English
  const langInstruction = state.lang === "ru"
    ? "на русском языке (даже если источник на английском — резюме должно быть на русском)"
    : "in English";

  const srcCount = (card.raw||[]).length;
  const sources  = (card.sources||[]).join(", ");
  const multiNote = srcCount > 1 ? "\n- Если источники расходятся — упомяни это одной фразой" : "";

  // Serious outlets get longer summaries
  const SERIOUS = ["Al Jazeera","BBC","Politico","Коммерсант","Forbes"];
  const isSerious = (card.sources||[]).some(s => SERIOUS.some(o => s.includes(o)));

  const lengthReq = isSerious
    ? "- 6-8 предложений, 160-220 слов — развёрнутый аналитический разбор с контекстом и последствиями"
    : "- 4-6 предложений, 100-140 слов";

  const prompt = "Напиши резюме новости " + langInstruction + ".\n\n"
    + "ИСТОЧНИК: " + sources + "\n\n"
    + "ТРЕБОВАНИЯ:\n"
    + lengthReq + "\n"
    + "- Конкретные факты: цифры, имена, даты, места — они обязательны\n"
    + "- НЕ начинай с 'Согласно', 'По данным', 'Сообщается', 'В статье'\n"
    + "- Объясни ПОЧЕМУ это важно и какие могут быть последствия (1-2 предложения)\n"
    + "- Не пересказывай дословно — авторская выжимка с контекстом"
    + multiNote + "\n\n"
    + (fromFull ? "Полный текст статьи:\n" : "RSS-описание новости:\n")
    + articleContent.slice(0, 6000);

  const groqKey = state.groqKey;

  try {
    if (groqKey) {
      const d = await groqFetch({
        model: "openai/gpt-oss-120b",
        max_tokens: isSerious ? 900 : 800,
        reasoning_effort: "low",
        temperature: 0.4,
        messages: [
          { role: "system", content: "Ты опытный редактор новостного агрегатора. Пишешь чёткие, информативные резюме с контекстом и анализом. Всегда на русском языке." },
          { role: "user",   content: prompt }
        ]
      }, groqKey, 22000);
      const text = d?.choices?.[0]?.message?.content?.trim();
      if (text) {
        modalCache[cardId] = {
          text, ai: true,
          powered: "Groq · GPT-OSS · " + (fromFull ? "из статьи" : "из RSS")
        };
        if (expandedId === cardId) renderSummary(bodyEl, cardId);
        return;
      }
    }
    throw new Error("no key or empty");
  } catch {
    const bodyNow = document.getElementById("expand-body-" + cardId);
    if (bodyNow && expandedId === cardId)
      bodyNow.innerHTML = renderTextHTML(getRSSText(card), false, false);
  }
}

  try {
    // groq/compound has built-in web search
    const d = await groqFetch({
      model: "groq/compound",
      max_tokens: 500,
      messages: [
        { role: "system", content: systemMsg },
        { role: "user",   content: question  }
      ]
    }, key, 25000);

    const raw = d?.choices?.[0]?.message?.content;
    let reply = Array.isArray(raw)
      ? raw.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim()
      : (raw||"").trim();

    aDiv.textContent = reply || "Нет ответа";
  } catch {
    // fallback to regular 70B
    try {
      const d2 = await groqFetch({
        model: "openai/gpt-oss-120b",
        max_tokens: 900,
        reasoning_effort: "low",
        messages: [
          { role: "system", content: systemMsg },
          { role: "user",   content: question  }
        ]
      }, key, 20000);
      aDiv.textContent = d2?.choices?.[0]?.message?.content?.trim() || "Нет ответа";
    } catch {
      aDiv.textContent = "Ошибка соединения с AI";

// ═══════════════════════════════════════════════════════════
// SHARE AS SCREENSHOT
// ═══════════════════════════════════════════════════════════
async function shareCardScreenshot(cardId) {
  const cardEl = document.getElementById("card-" + cardId);
  if (!cardEl) return;
  const btn = cardEl.querySelector(".share-screenshot-btn");
  if (btn) { btn.classList.add("loading"); btn.innerHTML = "⏳ Создаём..."; }

  const styleEl = document.createElement("style");
  styleEl.id = "__ss_style";
  let brand = null;

  try {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const cs = getComputedStyle(document.documentElement);
    const g = v => cs.getPropertyValue(v).trim();

    // Resolve all CSS vars to real values — html2canvas can't read var()
    const surface = g("--surface") || (isDark ? "#111009" : "#ffffff");
    const bg      = g("--bg")      || (isDark ? "#0d0d08" : "#f7f7f5");
    const text    = g("--text")    || (isDark ? "#f0efe8" : "#111111");
    const text2   = g("--text2")   || (isDark ? "#a8a89a" : "#555550");
    const text3   = g("--text3")   || (isDark ? "#666658" : "#99998e");
    const accent  = g("--accent")  || "#b8960c";
    const accent2 = g("--accent2") || "#8b6f00";
    const accentBg= g("--accent-bg")|| "#f8f2dc";
    const border  = g("--border")  || (isDark ? "#2a2a1e" : "#e2e2de");
    const border2 = g("--border2") || (isDark ? "#3a3a2e" : "#cacac4");
    const mono    = g("--mono")    || "monospace";
    const red     = g("--red")     || "#c0392b";

    // Inject resolved vars as real CSS properties scoped to the card
    styleEl.textContent = `
      #card-${cardId}, #card-${cardId} * {
        --bg:${bg}; --bg2:${isDark?"#161610":"#efefed"};
        --surface:${surface}; --border:${border}; --border2:${border2};
        --text:${text}; --text2:${text2}; --text3:${text3};
        --accent:${accent}; --accent2:${accent2}; --accent-bg:${accentBg};
        --mono:${mono}; --red:${red}; --green:#27ae60;
        --shadow-card:0 1px 4px rgba(0,0,0,.10);
      }`;
    document.head.appendChild(styleEl);

    // Expand card so full content is captured
    const origH = cardEl.style.height;
    const origO = cardEl.style.overflow;
    cardEl.style.height = "auto";
    cardEl.style.overflow = "visible";

    // Hide action buttons from screenshot
    const hideEls = cardEl.querySelectorAll(
      ".share-screenshot-btn,.expand-close,.card-ai-ask,.card-ai-ask-row"
    );
    hideEls.forEach(el => { el.dataset.ssHide = el.style.display; el.style.display = "none"; });

    // Add DOM branding element (reliable, no canvas font issues)
    brand = document.createElement("div");
    brand.id = "__ss_brand";
    brand.style.cssText = [
      "margin-top:12px", "padding:8px 0 4px",
      `border-top:1px solid ${border}`,
      "display:flex", "align-items:center", "justify-content:flex-end", "gap:3px",
      "opacity:0.55"
    ].join(";");
    brand.innerHTML =
      `<span style="font-size:10px;font-weight:800;letter-spacing:.18em;` +
      `color:${text};font-family:-apple-system,sans-serif;text-transform:uppercase">MMSAWW</span>` +
      `<span style="font-size:10px;font-weight:400;letter-spacing:.12em;` +
      `color:${text3};font-family:-apple-system,sans-serif;text-transform:uppercase"> NEWS</span>`;
    cardEl.appendChild(brand);

    // Wait one frame so injected styles paint
    await new Promise(r => setTimeout(r, 80));

    const canvas = await html2canvas(cardEl, {
      backgroundColor: surface,
      scale: Math.min(window.devicePixelRatio * 2, 4),
      useCORS: true,
      logging: false,
      allowTaint: true,
      scrollX: 0,
      scrollY: -window.scrollY,
    });

    // Restore DOM
    brand.remove(); brand = null;
    styleEl.remove();
    cardEl.style.height = origH;
    cardEl.style.overflow = origO;
    hideEls.forEach(el => { el.style.display = el.dataset.ssHide || ""; delete el.dataset.ssHide; });

    // Share (mobile) or download (desktop)
    const isMobile = !!(navigator.share && navigator.canShare);
    if (isMobile) {
      await new Promise(resolve => {
        canvas.toBlob(async blob => {
          if (!blob) { resolve(); return; }
          const file = new File([blob], "mmsaww-news.png", { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            try { await navigator.share({ files: [file] }); } catch {}
          } else { _dlCanvas(canvas); }
          resolve();
        }, "image/png");
      });
    } else {
      _dlCanvas(canvas);
    }

  } catch(e) {
    console.error("Screenshot:", e);
  } finally {
    // Always clean up
    brand?.remove();
    document.getElementById("__ss_style")?.remove();
    const el = document.getElementById("card-" + cardId);
    el?.querySelectorAll("[data-ss-hide]").forEach(e => {
      e.style.display = e.dataset.ssHide || ""; delete e.dataset.ssHide;
    });
    if (btn) { btn.classList.remove("loading"); btn.innerHTML = "📸 Поделиться"; }
  }
}

function _dlCanvas(canvas) {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "mmsaww-news.png";
  a.style.display = "none";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
